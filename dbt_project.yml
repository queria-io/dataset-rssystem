name: "rssystem"
version: "1.0.0"

profile: "rssystem"

model-paths: ["models"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  rssystem:
    +database: rssystem
    +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    review:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
