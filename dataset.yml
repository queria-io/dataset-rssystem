# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
name: rssystem
title: 行政事業レビュー見える化サイト
description: |-
  内閣官房行政改革推進本部事務局が行政事業レビュー見える化サイト（RS システム）で公開する、国の予算事業のレビューシートのデータです。全府省庁の予算事業を収録しています。

  行政事業レビュー（review）は、予算事業の一覧（review.projects）、根拠法令（review.legal_bases）、政策・施策（review.policies）、関係する計画・通知等（review.related_plans）、予算年度ごとの予算と執行（review.budgets）、支出先と契約（review.expenditures）です。事業年度と予算事業 ID で結合できます。根拠法令の法令 ID は e-Gov 法令検索の法令 ID で、e_gov データセットの法令と結合できます。支出先には国税庁の法人番号があります。毎月、最新の CSV を取得します。

  出典：行政事業レビュー見える化サイト（https://rssystem.go.jp）を加工して作成
keywords:
  - 行政事業レビュー
  - レビューシート
  - 予算事業
  - 予算
  - 執行額
  - 根拠法令
  - 支出先
  - 法人番号
  - 入札
  - 落札率
  - 政策評価
  - RSシステム
  - 内閣官房
  - 行政改革推進本部
homepage: https://github.com/queria-io/dataset-rssystem
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 行政事業レビュー見える化サイト CSV データのダウンロード
    path: https://rssystem.go.jp/download-csv
  - title: 行政事業レビュー見える化サイト 利用規約
    path: https://rssystem.go.jp/terms

contributors:
  - title: 内閣官房行政改革推進本部事務局
    path: https://www.gyoukaku.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: review
    title: 行政事業レビュー

annotations:
  queria:
    themes: [government_finance]
    cover: 📑
