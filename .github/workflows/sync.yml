name: Apply

on:
  push:
    branches: [main]
  schedule:
    # レビューシートは年に数回更新される。毎月 2 日 05:00 JST に取る
    - cron: "0 20 1 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@c146191a4b8515eff9174cf9856e86365e46bc56
    with:
      dataset_name: rssystem
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
